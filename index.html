<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="台灣小農購買指南，依節氣找當季蔬果、參考批發行情，直接前往小農的購買管道。">
<meta name="theme-color" content="#183d2e">
<title>雲端菜市場｜台灣小農購買指南</title>
<style>
:root {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-size: 112.5%;
  line-height: 1.65;
  color: #3c271e;
  background: #fff9ed;
  --accent: #923e22;
  --deep: #71301a;
  --soft: #fbe7c9;
  --line: #e5c6a8;
  --muted: #644b3d;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--deep); text-underline-offset: .18em; }
:focus-visible { outline: 3px solid #57268f; outline-offset: 3px; }
[hidden] { display: none !important; }
header { background: #f9deb2; border-bottom: 1px solid var(--line); }
nav, main, footer, .intro { width: min(1040px, calc(100% - 2rem)); margin-inline: auto; }
nav { display: flex; align-items: center; justify-content: flex-end; gap: .5rem 1rem; flex-wrap: wrap; padding: .5rem 0; }
nav a { display: inline-flex; align-items: center; min-height: 48px; font-weight: 700; }
.intro { padding: .25rem 0 1.6rem; }
.intro h1 { margin: 0; font-size: clamp(2.35rem, 7vw, 4.25rem); line-height: 1.2; color: var(--deep); }
.intro p { margin: .45rem 0 0; font-size: 1.1rem; }
section { margin: 1.6rem 0 2.5rem; scroll-margin-top: 1rem; }
h2 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.15rem); line-height: 1.3; }
h3, p { margin: .25rem 0; }
h3 { font-size: 1.18rem; line-height: 1.4; }
.muted, .meta { color: var(--muted); }
.meta { font-size: .94rem; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .85rem; margin-top: .8rem; }
.card { background: #fffdfa; border: 1px solid var(--line); border-radius: .9rem; padding: .95rem; overflow-wrap: anywhere; }
.pick { background: #fff0d7; }
.price { font-weight: 750; color: var(--deep); }
.pick button { margin-top: .5rem; }
.tag, .term { display: inline-block; color: #57351f; background: var(--soft); border-radius: .5rem; padding: .16rem .55rem; margin: .2rem .3rem .2rem 0; }
.term { margin-bottom: .55rem; }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: .8rem; margin: .9rem 0 .65rem; padding: .9rem; background: #fffdfa; border: 1px solid var(--line); border-radius: .9rem; }
.filters label { display: block; margin-bottom: .2rem; font-weight: 750; }
.search-row { display: flex; align-items: stretch; gap: .4rem; }
.search-row button { flex: none; }
input, select, button, .purchase { font: inherit; min-height: 48px; border: 1px solid #ac7960; border-radius: .5rem; padding: .44rem .65rem; color: #3c271e; background: #fff; }
input, select { width: 100%; min-width: 0; }
button { cursor: pointer; font-weight: 700; }
button:hover { background: var(--soft); }
.links { display: flex; gap: .35rem .65rem; flex-wrap: wrap; align-items: center; margin-top: .6rem; }
.links a { display: inline-flex; align-items: center; min-height: 48px; }
.links .purchase { color: white; background: var(--accent); border-color: var(--accent); text-decoration: none; font-weight: 750; }
.links .purchase:hover { background: var(--deep); }
#more { margin-top: .85rem; }
.notice, footer { border-top: 1px solid var(--line); padding: .9rem 0; }
summary { cursor: pointer; min-height: 48px; font-weight: 700; }
@media(max-width: 820px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media(max-width: 560px) {
  .grid, .filters { grid-template-columns: 1fr; }
  nav, main, footer, .intro { width: calc(100% - 1.4rem); }
  nav { justify-content: flex-start; }
}
</style>
<script defer src="market.js?v=2"></script>
</head>
<body>
<header>
<nav aria-label="主要導覽"><a href="#directory">找小農</a><a href="#season">看節氣推薦</a></nav>
<div class="intro"><h1>雲端菜市場</h1><p>找蔬果、找小農，查看店家的購買方式。</p></div>
</header>
<main>
<section id="directory">
  <h2>找小農</h2>
  <form class="filters" id="filters" role="search" aria-label="搜尋小農">
    <div><label for="search">輸入蔬果或店家名稱</label><div class="search-row"><input id="search" type="search" placeholder="例如：高麗菜、芭樂"><button id="clear" type="button">清除</button></div></div>
    <div><label for="category">販售類別</label><select id="category"><option value="">全部類別</option></select></div>
  </form>
  <p id="count" role="status">正在載入小農名錄。</p>
  <div class="grid" id="farms"></div>
  <button id="more" type="button" hidden>顯示更多店家</button>
  <p class="meta">名錄整理至 2026/10/05。販售品項以店家公告為準。</p>
</section>
<section id="season">
  <p class="term">目前節氣 <strong id="term">—</strong></p>
  <h2>這個節氣買什麼？</h2>
  <p class="muted">依台灣常見產季挑選。採收與供貨情形請向店家確認。</p>
  <div class="grid" id="picks"></div>
  <p class="meta" id="quote-status" role="status">正在載入批發行情。</p>
  <p class="meta">行情為台北二市場交易均價，單位為新臺幣／公斤。實際售價請見各店家。<a href="https://data.moa.gov.tw/open_search.aspx?id=037">農業部農產品交易行情</a></p>
</section>
<details class="notice"><summary>購買須知與防詐騙提醒</summary><p>本網站整理小農資訊。請透過各店家的購買管道交易，避免直接匯款給來路不明的帳號。若遇到可疑連結或解除分期付款要求，請保護個人資料並撥打 165 反詐騙專線。</p></details>
</main>
<footer>雲端菜市場 · 台灣小農購買指南</footer>
</body>
</html>
